# rtty configuration.
# Copy to ~/.config/rtty/rtty.conf and edit.
# Environment variables override this file: RTTY_TRANSPARENCY=0.8 wins over
# TRANSPARENCY=0.8 here. Priority: CLI, env, file, defaults.

TRANSPARENCY=1.0
PADDING_X=2
PADDING_Y=2
TITLE="Reliabilitty"
CLASS="Reliabilitty"
INSTANCE="rtty"
DECORATIONS="full"
STARTUP_MODE="windowed"
DYNAMIC_TITLE=true
DYNAMIC_PADDING=false

FONT_SIZE=11.0
FONT_DPI=0.0
FONT_FAMILY="monospace"
FONT_STYLE="Regular"
FONT_FALLBACK="Noto Sans Mono,DejaVu Sans Mono,Liberation Mono,Noto Color Emoji"
FONT_OFFSET_X=0
FONT_OFFSET_Y=0
GLYPH_OFFSET_X=0
GLYPH_OFFSET_Y=0
HINTING=true
# CELL_WIDTH=6
# CELL_HEIGHT=13

BACKGROUND="#1d1f21"
FOREGROUND="#c5c8c6"
CURSOR_COLOR="#c5c8c6"
CURSOR_TEXT_COLOR="#1d1f21"
SELECTION_BACKGROUND="#373b41"
SELECTION_FOREGROUND="#c5c8c6"
# Search highlights. Text contrast is chosen automatically.
SEARCH_MATCH_BACKGROUND="#f0c674"
SEARCH_CURRENT_BACKGROUND="#7aa6da"
COLOR_0="#1d1f21"
COLOR_1="#cc6666"
COLOR_2="#b5bd68"
COLOR_3="#f0c674"
COLOR_4="#81a2be"
COLOR_5="#b294bb"
COLOR_6="#8abeb7"
COLOR_7="#c5c8c6"
COLOR_8="#666666"
COLOR_9="#d54e53"
COLOR_10="#b9ca4a"
COLOR_11="#e7c547"
COLOR_12="#7aa6da"
COLOR_13="#c397d8"
COLOR_14="#70c0b1"
COLOR_15="#eaeaea"

CURSOR_STYLE="Block"
CURSOR_BLINK=true
CURSOR_BLINK_INTERVAL=600
CURSOR_UNFOCUSED_HOLLOW=true
CURSOR_THICKNESS=0.15

HISTORY=10000
WHEEL_MULTIPLIER=3
SAVE_TO_CLIPBOARD=false

# SHELL="/bin/sh"
# SHELL_ARGS="-l"
BELL_AUDIBLE=true
BELL_VISUAL=false

# ENV_TERM="xterm-256color"

# A binding list replaces the built-in set.
BINDING="Control|Shift+C:copy"
BINDING="Control|Shift+V:paste"
BINDING="Shift+Insert:paste"
BINDING="Control+Insert:copy"
# BINDING="Control+F:search"
BINDING="Control|Shift+F:search"
BINDING="Shift+PageUp:ScrollPageUp"
BINDING="Shift+PageDown:ScrollPageDown"
BINDING="Control|Shift+Home:ScrollToTop"
BINDING="Control|Shift+End:ScrollToBottom"
BINDING="F11:ToggleFullscreen"
