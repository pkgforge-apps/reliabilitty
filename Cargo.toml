[package]
name = "reliabilitty"
version = "0.1.19"
edition = "2024"
rust-version = "1.85"
description = "A small, CPU-rendered X11 terminal emulator"
license = "MIT"
readme = "README.md"
publish = false
repository = "https://github.com/pkgforge-apps/reliabilitty"
exclude = ["/.github", "/.agents", "/scripts"]

[[bin]]
name = "rtty"
path = "src/main.rs"

# Static binary only. No onelf, AppImage, macOS or Windows bundles.
[package.metadata.pkgforge]
appimage = false

[dependencies]
dirs = "7.0.0"
fontdb = "0.24.0"
libc = "0.2.191"
mimalloc = { version = "0.1.52", default-features = false, features = ["no_thp"] }
swash = "0.2.10"
unicode-normalization = "0.1.26"
unicode-width = "0.2.3"
x11rb = { version = "0.14.0", default-features = false, features = ["shm", "sync", "xkb", "randr"] }
xkeysym = "0.2.1"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
